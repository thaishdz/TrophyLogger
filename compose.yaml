services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - server/src/config/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - trophy-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - trophy-network

  database:
    image: mongo:8.2
    container_name: database
    command: mongod --replSet rs0 --bind_ip_all # rs0 es el nombre del replica set
    ports:
      - "27017:27017"
    volumes:
      - database-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trophy-network

  # inicializa el replica set y termina
  database-init:
    image: mongo:8.2
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./scripts/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: mongosh --host database:27017 /init-replica-set.js
    networks:
      - trophy-network

networks:
  trophy-network:
    driver: bridge

volumes:
  database-data:
